#:schema https://mise.jdx.dev/schema/mise.json
[tools]
fd = "latest"
fzf = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
opencode = "latest"
pnpm = "latest"
python = "latest"
ripgrep = "latest"
rust = "latest"
starship = "latest"
typst = "latest"
uv = "latest"
zig = "latest"
gh = "latest"
codex = "latest"
opam = { version = "latest", asset_pattern = 'opam-*-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os() }}' }
yazi = "latest"
clang = "latest"
lazydocker = "latest"
claude = "latest"

[env]
EDITOR = "nvim"
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
_.file = "{{ env.HOME }}/.config/.env"

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true
minimum_release_age = "0h"

[settings.npm]
package_manager = "pnpm"

[settings.python]
compile = false

[tasks.gituseriniad]
run = [
    "git config user.name 's1f10230101'",
    "git config user.email 's1f102301011@iniad.org'"
]
